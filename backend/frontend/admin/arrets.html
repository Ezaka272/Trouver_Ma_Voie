<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaxiBe | Gestion des Arrêts</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/LignesArret.css">
    <script src="../assets/js/arrets.js" defer></script>
    <script src="assets/js/admin-guard.js" defer></script>

    <link rel="stylesheet" href="/assets/css/settings-theme.css">
    <script src="/assets/js/i18n.js" defer></script>
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-bus"></i>

            <h2>Trouver Ma Voie</h2>

        </div>

        <nav>

            <a href="dashboard.html">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </a>

            <a href="lignes.html">
                <i class="fa-solid fa-road"></i>
                Lignes
            </a>

            <a href="arrets.html" class="active">
                <i class="fa-solid fa-location-dot"></i>
                Arrêts
            </a>
            
    <a href="../carte.html">
        <i class="fa-solid fa-map"></i>
        Carte
    </a>

    <a href="utilisateurs.html">
        <i class="fa-solid fa-users"></i>
        Utilisateurs
    </a>

    <a href="parametres.html">
        <i class="fa-solid fa-gear"></i>
        Paramètres
    </a>

    <a href="../index.html">
        <i class="fa-solid fa-right-from-bracket"></i>
        Déconnexion
    </a>
        

        </nav>

    </aside>

    <!-- Contenu -->

    <main class="main">

        <header>
             
           
            
            <div>

                <h1>Gestion des Arrêts</h1>

                <p>Administration TaxiBe</p>

            </div>

            <button id="btnAjouter">

                <i class="fa-solid fa-plus"></i>

                Ajouter

            </button>

        </header>

        <div class="toolbar">

            <input
                type="text"
                id="recherche"
                placeholder="Rechercher un arrêt...">

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Nom</th>

                        <th>Ligne</th>

                        <th>Ordre</th>

                        <th>Latitude</th>

                        <th>Longitude</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="tbody">

                </tbody>

            </table>

        </div>

    </main>

</div>

<!-- Modal -->

<div class="modal" id="modal">

    <div class="modal-content">

        <h2 id="titreModal">

            Ajouter un arrêt

        </h2>

        <input
            id="nom"
            placeholder="Nom de l'arrêt">

        <select id="ligne_id">

        </select>

        <input
            id="ordre"
            type="number"
            placeholder="Ordre">

        <input
            id="latitude"
            placeholder="Latitude">

        <input
            id="longitude"
            placeholder="Longitude">

        <div class="actions">

            <button id="annuler">

                Annuler

            </button>

            <button id="enregistrer">

                Enregistrer

            </button>

        </div>

    </div>

</div>


</body>

</html>
