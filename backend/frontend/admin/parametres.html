<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiBe | Paramètres</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/settings-theme.css">
    <style>
        .settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
        .settings-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.07)}
        .settings-card h3{margin-top:0;margin-bottom:18px}
        .setting-field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
        .setting-field input,.setting-field select{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}
        .color-row{display:flex;gap:12px;align-items:center}
        .color-row input[type=color]{width:62px;height:44px;padding:3px;border-radius:9px;cursor:pointer}
        .preview{border-radius:14px;padding:22px;color:#fff;background:var(--taxibe-primary);margin-top:10px}
        .preview span{display:block;margin-top:6px;opacity:.9}
        .save-bar{display:flex;align-items:center;gap:15px;margin-top:22px}
        .message{font-weight:600}
        @media(max-width:800px){.settings-grid{grid-template-columns:1fr}}
    </style>
    <script src="/assets/js/i18n.js" defer></script>
    <script src="assets/js/admin-guard.js" defer></script>
    <script src="assets/js/parametres.js" defer></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo"><i class="fa-solid fa-bus"></i><h2>Trouver Ma Voie</h2></div>
        <nav>
            <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> <span data-i18n="Dashboard"><span data-i18n="Dashboard">Dashboard</span></span></a>
            <a href="lignes.html"><i class="fa-solid fa-road"></i> <span data-i18n="Lignes"><span data-i18n="Lignes">Lignes</span></span></a>
            <a href="arrets.html"><i class="fa-solid fa-location-dot"></i> <span data-i18n="Arrêts"><span data-i18n="Arrêts">Arrêts</span></span></a>
            <a href="../carte.html"><i class="fa-solid fa-map"></i> <span data-i18n="Carte"><span data-i18n="Carte">Carte</span></span></a>
            <a href="utilisateurs.html"><i class="fa-solid fa-users"></i> <span data-i18n="Utilisateurs"><span data-i18n="Utilisateurs">Utilisateurs</span></span></a>
            <a href="parametres.html" class="active"><i class="fa-solid fa-gear"></i> <span data-i18n="Paramètres"><span data-i18n="Paramètres">Paramètres</span></span></a>
            <a href="../index.html" id="logoutLink"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="Déconnexion"><span data-i18n="Déconnexion">Déconnexion</span></span></a>
        </nav>
    </aside>

    <main class="main">
        <header><h1 data-i18n="Paramètres"><span data-i18n="Paramètres">Paramètres</span></h1></header>

        <div class="settings-grid">
            <section class="settings-card">
                <h3 data-i18n="Informations générales">Informations générales</h3>

                <div class="setting-field">
                    <label for="nom_application" data-i18n="Nom de l'application">Nom de l'application</label>
                    <input id="nom_application" type="text" maxlength="100" value="TaxiBe">
                </div>

                <div class="setting-field">
                    <label for="ville" data-i18n="Ville">Ville</label>
                    <input id="ville" type="text" maxlength="100" value="Antananarivo">
                </div>

                <div class="setting-field">
                    <label for="langue" data-i18n="Langue">Langue</label>
                    <select id="langue">
                        <option value="fr">Français</option>
                        <option value="mg">Malagasy</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <div class="setting-field">
                    <label for="mode" data-i18n="Mode d'affichage">Mode d'affichage</label>
                    <select id="mode">
                        <option value="light" data-i18n="Clair">Clair</option>
                        <option value="dark" data-i18n="Sombre">Sombre</option>
                        <option value="system" data-i18n="Système">Système</option>
                    </select>
                </div>
            </section>

            <section class="settings-card">
                <h3 data-i18n="Couleurs">Couleurs</h3>

                <div class="setting-field">
                    <label for="couleur_principale" data-i18n="Couleur principale">Couleur principale</label>
                    <div class="color-row">
                        <input id="couleur_principale" type="color" value="#0d6efd">
                        <input id="couleur_principale_text" type="text" value="#0d6efd" maxlength="7">
                    </div>
                </div>

                <div class="setting-field">
                    <label for="couleur_secondaire" data-i18n="Couleur secondaire">Couleur secondaire</label>
                    <div class="color-row">
                        <input id="couleur_secondaire" type="color" value="#00b894">
                        <input id="couleur_secondaire_text" type="text" value="#00b894" maxlength="7">
                    </div>
                </div>

                <div class="preview" id="preview">
                    <strong id="previewName">Trouver Ma Voie</strong>
                    <span id="previewCity">Antananarivo</span>
                </div>

                <div class="save-bar">
                    <button class="btn-ajout" id="saveSettings" type="button">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span data-i18n="Enregistrer">Enregistrer</span>
                    </button>
                    <span class="message" id="settingsMessage"></span>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
