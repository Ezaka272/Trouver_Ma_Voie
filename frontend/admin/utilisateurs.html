    <!-- MAIN -->

   <main class="main">

    <header>
      <div>
        <h1>Gestion des utilisateurs</h1>
        <p>Administration TaxiBe</p>
      </div>
        
        <button id="btnAjouter">
            <i class="fa-solid fa-user-plus"></i>
            Ajouter 
        </button>

    </header>
     
    <div class="toolbar">

            <input
                type="text"
                id="recherche"
                placeholder="Rechercher un utilisateur...">

        </div>
    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Nom</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Statut</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                <!-- <tr>

                    <td>Administrateur</td>
                    <td>admin@taxibe.mg</td>

                    <td>

                        <button class="btn-edit">
                            <i class="fa-solid fa-pen"></i>
                        </button>

                        </button>

                    </td>

                </tr> -->

            </tbody>

        </table>

    </div>

</main>

</div>
<!-- Modal -->
<div class="modal" id="modal">

    <div class="modal-content">

        <h2 id="titreModal">

            Ajouter un utilisateur

        </h2>

        <input
            id="nom"
            placeholder="Fyh">

       
        <input
            id="email"
            type="email"
            placeholder="Fyh@gmail.org">

        <select id="role">
            <option value="voyageur">Voyageur</option>
            <option value="admin">Administrateur</option>
        </select>

        <input
            id="motDePasse"
            type="password"
            placeholder="Mot de passe (6 caractères minimum)"
            autocomplete="new-password">

       
        <div class="actions">

            <button id="annuler">

                Annuler

            </button>

            <button id="enregistrer">

                Enregistrer

            </button>

        </div>

    </div>

</div>
</body>
