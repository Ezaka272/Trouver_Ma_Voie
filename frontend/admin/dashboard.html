<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaxiBe | Dashboard</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <script src="../assets/js/dashboard.js" defer></script>
    <script src="assets/js/admin-profile.js" defer></script>
    <script src="assets/js/admin-guard.js" defer></script>
    <link rel="stylesheet" href="/assets/css/settings-theme.css">
    <script src="/assets/js/i18n.js" defer></script>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-bus"></i>

            <h2>Trouver Ma voie</h2>

        </div>
<nav>

    <a href="dashboard.html" class="active">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </a>

    <a href="lignes.html">
        <i class="fa-solid fa-road"></i>
        Lignes
    </a>

    <a href="arrets.html">
        <i class="fa-solid fa-location-dot"></i>
        Arrêts
    </a>
    <a href="../carte.html">
        <i class="fa-solid fa-map"></i>
        Carte
    </a>

    <a href="utilisateurs.html">
        <i class="fa-solid fa-users"></i>
        Utilisateurs
    </a>

    <a href="parametres.html">
        <i class="fa-solid fa-gear"></i>
        Paramètres
    </a>

    <a href="../index.html">
        <i class="fa-solid fa-right-from-bracket"></i>
        Déconnexion
    </a>

</nav>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <!-- HEADER -->

        <header>

            <div>

                <h1><span data-i18n="Dashboard">Dashboard</span></h1>

                <p>Bienvenue Administrateur</p>

            </div>

            <div class="profil">

    <label for="photoProfil" class="photo-container">
        <img
            id="photoAdmin"
            src="../assets/images/default-avatar.svg"
            alt="Photo de profil"
        >

        <span class="photo-overlay">
            <i class="fa-solid fa-camera"></i>
        </span>
    </label>

    <input
        type="file"
        id="photoProfil"
        accept="image/*"
        hidden
    >

    <span>Admin</span>

</div>

        </header>

        <!-- STATISTIQUES -->

        <section class="stats">

            <div class="card">

                <i class="fa-solid fa-road"></i>

                <div>

                    <h2 id="nbLignes">0</h2>

                    <p><span data-i18n="Lignes">Lignes</span></p>

                </div>

            </div>

            <div class="card">

                <i class="fa-solid fa-location-dot"></i>

                <div>

                    <h2 id="nbArrets">0</h2>

                    <p><span data-i18n="Arrêts">Arrêts</span></p>

                </div>

            </div>

            <div class="card">

                <i class="fa-solid fa-magnifying-glass"></i>

                <div>

                    <h2 id="nbRecherche">0</h2>

                    <p>Recherches</p>

                </div>

            </div>

            <div class="card">

                <i class="fa-solid fa-star"></i>

                <div>

                    <h2 id="nbFavoris">0</h2>

                    <p>Favoris</p>

                </div>

            </div>

        </section>

        <!-- ACTIVITE -->

        <section class="dashboard-grid">

            <div class="box">

                <h3>

                    Dernières lignes

                </h3>

                <table>

                    <thead>

                        <tr>

                            <th>N°</th>

                            <th>Départ</th>

                            <th>Destination</th>

                        </tr>

                    </thead>

                    <tbody id="dernieresLignes">

                    </tbody>

                </table>

            </div>

            <div class="box">

                <h3>

                    Activité récente

                </h3>

                <div id="activite">

                </div>
                
                <p id="date"></p>

            </div>

        </section>

    </main>

</div>




</body>

</html>
