<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>TaxiBe | Inscription</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
        <link rel="stylesheet" href="../assets/css/style.css">
        <link rel="stylesheet" href="auth.css">
        <script src="auth.js" defer></script>
        <script src="../assets/js/user-common.js" defer></script>
        <link rel="stylesheet" href="/assets/css/settings-theme.css">
    <script src="/assets/js/i18n.js" defer></script>
</head>
    <body class="auth-body">
        <main class="auth-card">
            <a class="auth-logo" href="../index.html"><i class="fa-solid fa-bus"></i> TaxiBe</a>
            <h1>Créer un compte</h1>
            <p>Enregistrez-vous comme voyageur.</p>
            <form id="registerForm">
                <label>Nom<input id="nom" required autocomplete="name"></label>
                <label>Email<input id="email" type="email" required autocomplete="email"></label>
                <label>Mot de passe<input id="password" type="password" minlength="6" required autocomplete="new-password"></label>
                <label>Confirmer<input id="confirm" type="password" minlength="6" required autocomplete="new-password"></label>
                <button type="submit">Créer mon compte</button>
            </form>
            <p id="message" class="auth-message"></p>
            <a href="login.html">J'ai déjà un compte</a>
        </main>
    </body>
    </html>
