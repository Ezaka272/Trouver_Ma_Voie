<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaxiBe | Lignes</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/resultat.css">
    <link rel="stylesheet" href="assets/css/settings-theme.css">

    <script src="assets/js/i18n.js" defer></script>
    <script src="assets/js/user-common.js" defer></script>
    <script src="assets/js/lignes-user.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header class="topbar">

        <a href="index.html" class="back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="topbar-title">
            <span class="topbar-kicker">Trouver Ma Voie</span>
            <h1>Les lignes</h1>
        </div>

    </header>


    <main class="page">

        <!-- INTRODUCTION -->

        <section class="lignes-intro">

            <div class="intro-icon">
                <i class="fa-solid fa-bus"></i>
            </div>

            <div>
                <h1>Toutes les lignes</h1>

                <p>
                    Retrouvez facilement les lignes de TaxiBe
                    disponibles à Antananarivo.
                </p>
            </div>

        </section>


        <!-- RECHERCHE -->

        <section class="lignes-search">

            <div class="search-input">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="rechercheLigne"
                    placeholder="Rechercher une ligne, un départ..."
                    autocomplete="off"
                >

                <!-- <button
                    type="button"
                    id="clearSearch"
                    title="Effacer">

                    <i class="fa-solid fa-xmark"></i>

                </button> -->

            </div>


            <div class="ligne-filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all">

                    Toutes

                </button>


                <button
                    type="button"
                    class="filter-btn"
                    data-filter="favorites">

                    <i class="fa-regular fa-star"></i>

                    Mes favoris

                </button>

            </div>

        </section>


        <!-- INFORMATIONS -->

        <section class="lignes-toolbar">

            <div>

                <strong id="nombreLignes">
                    0
                </strong>

                <span>
                    ligne(s)
                </span>

            </div>


            <select id="triLignes">

                <option value="numero">
                    Trier par numéro
                </option>

                <option value="depart">
                    Trier par départ
                </option>

                <option value="destination">
                    Trier par destination
                </option>

            </select>

        </section>


        <!-- LISTE -->

        <section id="listeLignesUtilisateur"
            class="lignes-grid">

            <div class="result-message">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <p>
                    Chargement des lignes...
                </p>

            </div>

        </section>


        <!-- MESSAGE VIDE -->

        <section
            id="aucuneLigne"
            class="empty-state"
            hidden>

            <i class="fa-solid fa-road"></i>

            <h3>
                Aucune ligne trouvée
            </h3>

            <p>
                Essayez une autre recherche.
            </p>

        </section>

    </main>


    <!-- NAVIGATION -->

    <nav class="bottom-nav">

        <a href="index.html">

            <i class="fa-solid fa-house"></i>

            <span>
                Accueil
            </span>

        </a>


        <a
            href="lignes.html"
            class="active">

            <i class="fa-solid fa-road"></i>

            <span>
                Lignes
            </span>

        </a>


        <a href="favoris.html">

            <i class="fa-regular fa-heart"></i>

            <span>
                Favoris
            </span>

        </a>


        <a href="profil.html">

            <i class="fa-regular fa-user"></i>

            <span>
                Profil
            </span>

        </a>

    </nav>

</body>

</html>
