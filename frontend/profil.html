<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>TaxiBe | Mon Profil</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/profil.js" defer></script>
        <link rel="stylesheet" href="/assets/css/settings-theme.css">
    <script src="/assets/js/i18n.js" defer></script>
<script src="/assets/js/user-common.js" defer></script>
</head>
    <body>
        <header class="home-header">
            <div class="logo">
                <i class="fa-solid fa-bus"></i>
                <h2>Trouver Ma Voie</h2>
            </div>
            <a href="index.html" class="back-button">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </header>
        <main class="profile-page">
            <section class="profile-card">
                <div class="profile-photo-container">
                    <label for="photoProfil" class="profile-photo">
                        <img id="profileImage" src="assets/images/default-avatar.svg" alt="Photo de profil">
                        <span class="photo-camera">
                            <i class="fa-solid fa-camera"></i>
                        </span>
                    </label>
                    <input type="file" id="photoProfil" accept="image/*" hidden>
                </div>
                <h1 id="nomTitre">Mon profil</h1>
                <p class="profile-subtitle">Gérez vos informations personnelles</p>
                <div class="profile-info">
                    <div class="profile-item">
                        <i class="fa-solid fa-user"></i>
                        <div>
                            <span>Nom</span>
                            <strong id="nomUtilisateur">-</strong>
                        </div>
                    </div>
                    <div class="profile-item">
                        <i class="fa-solid fa-envelope"></i>
                        <div>
                            <span>Email</span>
                            <strong id="emailUtilisateur">-</strong>
                        </div>
                    </div>
                    <div class="profile-item">
                        <i class="fa-solid fa-heart"></i>
                        <div><span>Favoris</span>
                            <strong id="nbFavorisProfil">0</strong>
                        </div>
                    </div>
                </div>
                <button class="profile-button" id="modifierProfil"><i class="fa-solid fa-pen"></i> Modifier mon profil</button>
                <button class="logout-button" id="deconnexion"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</button>
                <p id="profilMessage" class="auth-message"></p>
            </section>
        </main>
        <nav class="bottom-nav">
            <a href="index.html"><i class="fa-solid fa-house"></i>
                <span>Accueil</span>
            </a>
            <a href="lignes.html">
<i class="fa-solid fa-road"></i>
Lignes
</a>

<a href="favoris.html"><i class="fa-solid fa-heart"></i>
                <span>Favoris</span>
            </a>
            <a href="carte.html"><i class="fa-solid fa-map"></i>
                <span><span data-i18n="Carte">Carte</span></span>
            </a>
            <a href="profil.html" class="active">
                <i class="fa-solid fa-user"></i>
                <span>Profil</span>
            </a>
        </nav>
    </body>
    </html>
